<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Rounded Background -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="3.5"/>

  <!-- Network Circuit Lines -->
  <path d="M 40 80 L 90 80 L 128 118" stroke="#1E3A5F" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 216 80 L 166 80 L 128 118" stroke="#1E3A5F" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 128 118 L 128 180" stroke="#1E3A5F" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Glowing Steam Game Controller / Route Icon -->
  <g filter="url(#glow)">
    <!-- Controller Body -->
    <path d="M 68 100 C 50 100 40 120 44 150 C 48 180 72 195 90 185 L 105 160 C 115 152 141 152 151 160 L 166 185 C 184 195 208 180 212 150 C 216 120 206 100 188 100 C 158 100 148 112 128 112 C 108 112 98 100 68 100 Z"
          fill="#0B132B" stroke="url(#glowGrad)" stroke-width="5"/>
    
    <!-- D-PAD / Route Arrows (Left) -->
    <rect x="74" y="126" width="18" height="6" rx="2" fill="#38BDF8"/>
    <rect x="80" y="120" width="6" height="18" rx="2" fill="#38BDF8"/>

    <!-- Action Buttons (Right) -->
    <circle cx="174" cy="124" r="3.5" fill="#00E676"/>
    <circle cx="184" cy="134" r="3.5" fill="#38BDF8"/>
    <circle cx="164" cy="134" r="3.5" fill="#FFB900"/>
    <circle cx="174" cy="144" r="3.5" fill="#FF5252"/>

    <!-- Steam Crank / Central Connecting Node -->
    <circle cx="128" cy="134" r="10" fill="#0F172A" stroke="url(#glowGrad)" stroke-width="3"/>
    <circle cx="128" cy="134" r="4" fill="#00F2FE"/>

    <!-- Shield / Route Fixer Lightning Badge (Bottom Center) -->
    <path d="M 128 172 L 138 188 L 130 188 L 134 206 L 118 192 L 126 192 Z" fill="url(#accentGrad)"/>
  </g>
</svg>
